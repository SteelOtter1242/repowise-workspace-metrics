name: Test extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  beta-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install counter and verified beta contract
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc
          python -m pip install \
            'repowise @ git+https://github.com/SteelOtter1242/repowise-ifx.git@86caf6a53b4c39aba5579be4229b4cb442c6038f' \
            .
      - name: Test plugin, census, ownership, purpose and history
        run: |
          repowise workspace-metrics --help
          python -m unittest discover -s tests -v
